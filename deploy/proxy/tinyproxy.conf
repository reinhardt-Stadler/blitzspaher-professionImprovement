# tinyproxy 配置 —— L6 出网白名单的执行点
# 保持最小化：只写必需项，避免版本差异导致的语法问题
# 修改后：docker compose restart proxy

Port 8888
Listen 0.0.0.0

User nobody
Group nogroup

LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info

Timeout 600
MaxClients 50

# 白名单核心：不在 filter 文件里的域名一律拒绝
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterCaseSensitive No
FilterURLs On
FilterExtended On

# 只允许 CONNECT 到 443，阻断任意端口隧道
ConnectPort 443

# 不泄露代理实现
DisableViaHeader Yes
